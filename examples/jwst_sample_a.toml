# JWST GO 1568 Sample A (Eduardo et al. 2026, AJ 172, 187).
# Seed for SurveyCharacterizations, where it lives with the rest of the survey as
# characterization/jwst_sample_a/jwst_sample_a.toml:
#   survey_debias --survey characterization/jwst_sample_a/jwst_sample_a.toml --root .
#
# Short arcs do not constrain (a, e), so this survey uses model_ae.
# Paths are relative to --root.
#
# Geometry lives with the characterization, not here:
#   characterization/jwst_sample_a/jwst_sample_a.csv  detections
#   characterization/jwst_sample_a/survey.conf     detections_required = 3
#   characterization/jwst_sample_a/epoch{1,2,3}/pointings.list
#     0.2236068 0.2236068 209.3875 -10.865278 2459969.32118 1.0 JWST.csv jwst_sample_a.eff
#     (epoch2: JD 2459973.96785, epoch3: JD 2459979.90854)
#   characterization/jwst_sample_a/epoch{1,2,3}/jwst_sample_a.eff   (filter= H)
#   characterization/jwst_sample_a/epoch{1,2,3}/JWST.csv
# and colours in colour.toml (F150W2 is labelled H; "H-g" = -1.7 puts it one
# magnitude brighter than r).

[survey]
name = "JWST Sample A"
model_band = "r"
colour_file = "colour.toml"
surveys = ["jwst_sample_a"]
paper_reference_jd = 2459974.5  # orbit-fit reference, not a visit
rate_cut_min_arcsec_hr = 0.03
rate_cut_max_arcsec_hr = 8.66
detections_relpath = "characterization/jwst_sample_a/jwst_sample_a.csv"
detections_full_name = "characterization/jwst_sample_a/jwst_sample_a.detections-full"
results_name = "characterization/jwst_sample_a/jwst_sample_a.bias.csv"
check_detected_title = "detected at all 3 epochs"
bias_method = "model_ae"

# Program name = column in the detections table. These are the columns read.
# model_ae requires mag, d_bary, and i. Omit a or e when the table has neither.
[detection_columns]
mag = "m_f150w2"
name = "name"
a = "a"
e = "e"
i = "i"
d_bary = "d_bary"
comp = "comp"

# The catalogue has no survey or block column: every row is
# jwst_sample_a/jwst_sample_a.
[detection_defaults]
survey = "jwst_sample_a"
block = "jwst_sample_a"
